# Python lint and format rules for every Python package in the repo. Each package's
# pyproject.toml extends this file and adds only what is its own.
target-version = "py314"
line-length = 99

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "ASYNC", "PL"]
ignore = [
    "PLR2004",  # tests compare against literal frame counts on purpose
]
