# winget manifest template (ADR 0024): filled in by hand at release time, once
# the publisher is chosen, and submitted to microsoft/winget-pkgs (the release
# checklist's Publishing item). Every {{...}} comes from identity.wxi or the
# signed release MSI. The file name follows the PackageIdentifier.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
PackageIdentifier: {{WingetId}}
PackageVersion: {{X.Y.Z}}
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
ElevationRequirement: elevatesSelf
# A driver update with apps holding a Device finishes at the next restart.
ExpectedReturnCodes:
  - InstallerReturnCode: 3010
    ReturnResponse: rebootRequiredToFinish
Installers:
  - Architecture: x64
    InstallerUrl: {{https URL of the signed MSI, GitHub release asset}}
    InstallerSha256: {{SHA-256 of that MSI}}
    ProductCode: "{{ProductCode of that MSI}}"
ManifestType: installer
ManifestVersion: 1.9.0
