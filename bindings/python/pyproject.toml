[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "pattie"
version = "0.1.0"
description = "Virtual microphones and speakers that every app sees as real audio devices"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
# No runtime dependencies: nothing to install besides this package.
dependencies = []

[dependency-groups]
dev = [
    "maturin>=1.16,<2",
    "pytest>=9",
    "ruff>=0.14",
    "ty>=0.0.1a30",
    "websockets>=17.4",
]

[tool.maturin]
module-name = "pattie._native"
python-source = "python"

[tool.uv]
# The project's own builds include the SDK's Fake backend (pattie._testing) so
# the tests run without the driver. Wheels for users are built by release.yml
# with plain `maturin build`, which leaves it out.
config-settings = { build-args = "--features fake-backend" }
# Rebuild the extension whenever its Rust or the SDK's changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../crates/sdk/Cargo.toml" },
    { file = "../../crates/sdk/src/**/*.rs" },
    { file = "../../crates/sdk/build.rs" },
    { file = "../../core/**/*.{c,h}" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The shared rules are in the repo's root ruff.toml; only this package's own are here.
extend = "../../ruff.toml"

[tool.ruff.lint]
extend-ignore = [
    "N818",  # the exception names are the SDK's error names (DuplicateName, ...)
]

[tool.ruff.lint.per-file-ignores]
# The stub package re-exports each topic stub with `from .x import *`, the stub-file way.
"python/pattie/_native/__init__.pyi" = ["F403"]

[tool.ruff.lint.isort]
# The package lives in python/, so ruff can't tell it's this project's own.
known-first-party = ["pattie"]

[tool.ty.environment]
python-version = "3.14"
