[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pipecat-pattie"
version = "0.1.0"
description = "A Pipecat transport for Pattie: a bot's own virtual microphone and speaker, which meeting apps see as real devices"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = ["pipecat-ai>=1.16,<2", "pattie>=0.1"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.14", "ty>=0.0.1a30"]

[tool.uv]
config-settings-package = { pattie = { build-args = "--features fake-backend" } }

[tool.uv.sources]
# The binding from this repository, built with its test backend
# (pattie._testing) so these tests run without the driver.
pattie = { path = "../../bindings/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_pattie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# The shared rules are in the repo's root ruff.toml.
extend = "../../ruff.toml"

[tool.ty.environment]
python-version = "3.14"
