[package]
name = "pattie-install"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Puts the Pattie driver on a Windows machine or takes it off (ADR 0016, ADR 0024): the one engine behind `pattie-cli install` and the MSI's custom action"

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
