[package]
name = "viaduct"
version = "0.1.0"
edition.workspace = true
description = "Create named virtual microphones and speakers that other apps see as real audio devices"
publish = false # the crates.io name is taken; rename before publishing (.ai/POST-V0.md)

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[features]
# Hidden, for tests: compiles the Core host (and the C core) outside Linux, so the
# contract suite runs against it on every OS. Off by default: Windows app builds
# compile no C (ADR 0012).
test-backend = []

[build-dependencies]
cc = "1.11.0" # compiles the C core for the Core host (build.rs)

[dev-dependencies]
# The SDK's own tests run with its test backend.
viaduct = { path = ".", features = ["test-backend"] }

[lints]
workspace = true
