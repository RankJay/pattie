[package]
name = "viaduct-cli"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Creates a Viaduct microphone or speaker from the command line, for testing the driver"

[[bin]]
name = "viaduct-cli"
path = "src/main.rs"

[dependencies]
viaduct = { path = "../viaduct" }
viaduct-install = { path = "../viaduct-install" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Performance", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_Security"] }

[lints]
workspace = true
