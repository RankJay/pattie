[package]
name = "viaduct-install"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Puts the Viaduct driver on a Windows machine or takes it off (ADR 0016, ADR 0024): the one engine behind `viaduct-cli install` and the MSI's custom action"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
