[workspace]
members = ["crates/viaduct", "crates/viaduct-cli", "core/tests"]
resolver = "3"

[workspace.package]
edition = "2024"

# Lint rules for every crate (each opts in with `[lints] workspace = true`).
# `cargo clippy --workspace --all-targets -- -D warnings` turns warnings into errors.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"     # unsafe calls stay in explicit blocks, even in unsafe fns
unused_unsafe = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny" # every `unsafe { }` carries a `// SAFETY:` comment
missing_safety_doc = "deny"         # every `unsafe fn` documents its contract
unnecessary_safety_comment = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# FFI and shared memory: one unsafe operation per block, so each SAFETY comment
# argues one thing; no pointer casts that hide a type or alignment change.
multiple_unsafe_ops_per_block = "deny"
ptr_as_ptr = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
# Banned by name in clippy.toml, with the reason.
disallowed_methods = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
