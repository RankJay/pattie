# On a version tag (v<a.b.c.d>, the driver's DriverVer): build the driver package,
# the attestation cab, pattie-cli for Windows and Linux, and the Python wheels,
# and attach them to a draft GitHub Release. Nothing goes to PyPI from here. Nothing is signed here: the cab still goes through EV
# signing and Partner Center by hand (.ai/ops/vm-steps.md, section H).
name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Driver version, four numbers (e.g. 0.1.0.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${INPUT:-${TAG#v}}"
          [[ "$version" =~ ^[0-9]{1,5}(\.[0-9]{1,5}){3}$ ]] || { echo "Not a.b.c.d: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  driver:
    name: Driver package and attestation cab
    needs: version
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/restore-wdk
      - name: Build the driver and the cab
        shell: pwsh
        run: ./release/make-attestation-cab.ps1 -Version '${{ needs.version.outputs.version }}' -WdkNuGet
      - name: Collect the unsigned driver package
        shell: pwsh
        run: |
          $package = 'target/release-files/pattie-driver-${{ needs.version.outputs.version }}-x64-unsigned'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item target/driver/x64/Release/pattie.inf, target/driver/x64/Release/pattie.sys, target/driver/x64/Release/pattie.pdb $package
          Compress-Archive "$package/*" "$package.zip"
          Copy-Item target/attestation/*.cab target/release-files/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver
          path: |
            target/release-files/*.zip
            target/release-files/*.cab

  cli:
    name: pattie-cli (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-2025-vs2026
            binary: pattie-cli.exe
          - os: linux
            runner: ubuntu-24.04
            binary: pattie-cli
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; installs rustup where it is missing
        with:
          toolchain: stable
      - name: Rust toolchain (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - if: matrix.os == 'windows'
        uses: ./.github/actions/setup-libclang
      - name: Build
        run: cargo build --release -p pattie-cli
      - name: Name it for the release
        shell: bash
        run: |
          mkdir -p target/release-files
          cp "target/release/${{ matrix.binary }}" \
            "target/release-files/${{ matrix.os }}-${{ matrix.binary }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.os }}
          path: target/release-files/*

  wheels:
    name: Python wheel (${{ matrix.os }} ${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm # built natively: no cross compiler for the C core
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # One abi3 wheel per platform serves every CPython from 3.14 on. The
      # Fake backend stays out: plain features only.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out ../../target/release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release-files/*.whl

  npm-binaries:
    name: Node.js binary (${{ matrix.os }} ${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            cross: ""
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # glibc 2.17's toolchain, so the binary runs on older distributions,
            # as the wheels' manylinux does.
            cross: --use-napi-cross
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm # built natively: no cross compiler for the C core
            target: aarch64-unknown-linux-gnu
            cross: --use-napi-cross
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: bindings/javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; installs rustup where it is missing
        with:
          toolchain: stable
      - name: Rust toolchain (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      # The Fake backend stays out: plain features only.
      - run: pnpm napi build --platform --release --esm --target ${{ matrix.target }} ${{ matrix.cross }} --output-dir native --js index.js --dts index.d.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/javascript/native/*.node

  npm:
    name: npm packages
    needs: [version, npm-binaries]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bindings/javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; installs rustup where it is missing
        with:
          toolchain: stable
      - name: Rust toolchain (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: bindings/javascript/artifacts
          merge-multiple: true
      # The loader and types (from this runner's release build), then the
      # TypeScript layer without pattie/_testing.
      - run: pnpm build
      - name: One package per platform, holding its binary
        run: |
          pnpm napi create-npm-dirs
          pnpm napi artifacts --output-dir artifacts
      # What `napi pre-publish` would add: each platform's package, as an
      # optional dependency the matching platform installs.
      - name: The main package's optional dependencies
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            const names = ['win32-x64-msvc', 'linux-x64-gnu', 'linux-arm64-gnu'];
            pkg.optionalDependencies = Object.fromEntries(names.map((n) => ['pattie-' + n, pkg.version]));
            writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - name: Pack them all (not published)
        run: |
          mkdir -p ../../target/release-files
          for folder in npm/*/; do npm pack "$folder" --pack-destination ../../target/release-files; done
          npm pack --pack-destination ../../target/release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: target/release-files/*.tgz

  release:
    name: Draft release
    needs: [version, driver, cli, wheels, npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Pattie ${{ needs.version.outputs.version }}
          draft: true
          files: files/*
          body: |
            Built by release.yml. Draft until checked:

            - `pattie-driver-*-x64-unsigned.zip`: the driver package (inf, sys, pdb), unsigned.
            - `pattie-*.cab`: the attestation cab. Sign it with the EV certificate, submit it
              in Partner Center, then run the gate (.ai/ops/vm-steps.md, section H).
            - `windows-pattie-cli.exe`, `linux-pattie-cli`: the test tool.
            - `pattie-*.whl`: the Python package (CPython 3.14+), for
              Windows x64 and Linux x64/arm64. Not on PyPI yet.
            - `pattie-0.*.tgz` and `pattie-<platform>-*.tgz`: the Node.js package (Node 22+, Electron)
              and its binary for Windows x64 and Linux x64/arm64. Not on npm yet.
