# The runner has no systemd user session: start PipeWire and WirePlumber by hand, in
# a D-Bus session, and run one command against them. Linux only.
name: headless-pipewire
description: Run a command against a headless PipeWire and WirePlumber
inputs:
  run:
    description: The command to run while PipeWire is up (bash)
    required: true
  working-directory:
    description: Where to run it (a composite step ignores the job's defaults)
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install PipeWire and WirePlumber
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq pipewire pipewire-bin wireplumber dbus
    - name: Run it against a headless PipeWire
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.run }}
      run: |
        export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
        mkdir -m 700 "$XDG_RUNTIME_DIR"
        dbus-run-session -- bash -euo pipefail -c '
          pipewire & sleep 1
          wireplumber & sleep 2
          wpctl status
          eval "$COMMAND"
        '
