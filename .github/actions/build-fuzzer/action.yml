# The Core's libFuzzer target with AddressSanitizer, into target/fuzz/hostile_apps.
name: build-fuzzer
description: Build the Core's fuzz target (libFuzzer + AddressSanitizer)
runs:
  using: composite
  steps:
    - name: Build the fuzzer (libFuzzer + AddressSanitizer)
      shell: bash
      # clang is on GitHub's image; installing it keeps the job portable (act's
      # images have none).
      run: |
        command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
        mkdir -p target/fuzz/corpus
        clang -fsanitize=fuzzer,address -g -O1 -std=c17 -Wall -Wextra -Werror -Wconversion -Wsign-conversion \
          -Icore/include -Icore/src core/src/commands.c core/src/ring.c core/src/clock.c \
          core/src/pcm16.c core/tests/fuzz/hostile_apps.c -o target/fuzz/hostile_apps
