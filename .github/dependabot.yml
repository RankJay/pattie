# Dependency updates, one pull request per ecosystem and week. Actions are pinned by
# commit SHA with the version in a comment (`@<sha> # v1.2.3`); Dependabot updates both.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Titles become "ci: bump ...", which the PR title check (pr-title.yml) accepts.
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
