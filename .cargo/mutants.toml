# cargo-mutants (`cargo mutants`): small deliberate bugs, each run against the
# tests; a bug no test catches is a gap. It skips what coverage skips (README,
# Coverage): code that only does something against a live driver, endpoint or
# machine setup, checked in the test VM. And test code itself.
exclude_globs = [
    "crates/sdk/src/backend/windows.rs",
    "crates/cli/src/main.rs",
    "crates/cli/src/commands/**",
    "crates/install/src/setup/**",
    "crates/msi/src/installer_api.rs",
    "crates/msi/src/installer_api/**",
    # The Linux backend: not compiled on Windows, where mutation runs (locally and
    # nightly.yml), so every mutant there would read as missed. Its tests run on
    # Linux (ci.yml), the PipeWire parts against a real PipeWire.
    "crates/sdk/src/backend/linux/mod.rs",
    "crates/sdk/src/backend/linux/**",
    "crates/sdk/src/backend/in_process/name_claim.rs",
    "crates/sdk/src/os/*/linux.rs",
    # Test scaffolding (the contract suite's nodes), never shipped; coverage
    # leaves it out too.
    "crates/sdk/src/backend/fake.rs",
    "core/tests/**",
    # Test code in its own files under src/ (`tests.rs`, `tests/`): cargo-mutants
    # names it without `tests::`, so the ` tests::` pattern below no longer catches it.
    "crates/sdk/src/**/tests.rs",
    "crates/sdk/src/**/tests/**",
    # The end-to-end integrity tests (`#[cfg(test)] mod e2e`): a test suite with
    # its own analyzer, not shipped code. A mutant there bends the checker, and
    # 31 of them read as missed (nightly, 2026-11-21 on).
    "crates/sdk/src/e2e/**",
    "crates/install/src/**/tests.rs",
    "crates/cli/src/**/tests.rs",
    "crates/cli/src/**/tests/**",
    # The Python binding: its tests are Python (pytest), which cargo-mutants
    # can't run, so all ~480 of its mutants would read as missed. Mutation-test
    # it with a Python tool if it's wanted.
    "bindings/python/src/**",
    # The Node.js binding, likewise: its tests are JavaScript (node:test).
    "bindings/javascript/src/**",
]

# Speed (2026-11-14: 1,378 mutants at 94 s of tests each was ~14 hours, far past
# nightly.yml's 90 minutes). The `mutants` profile (Cargo.toml) is the test
# profile at opt-level 1: same checks, the suite in ~32 s instead of ~84. A
# mutant that hangs (a loop that never ends) is cut at 3x the baseline instead
# of the default 5x. nightly.yml runs one shard of the rest per job.
profile = "mutants"
timeout_multiplier = 3.0

# Run every crate's tests against each bug, not only the bugged crate's: the SDK's
# ABI constants are checked against the C header by core/tests (abi_mirror).
test_workspace = true

# Bugs no host test can observe, each with its reason.
exclude_re = [
    # Freeing memory or closing a handle: a leak isn't visible without an
    # allocator (or handle table) that counts.
    "<impl Drop for (RingMemory|Core|CoreOwner)>::drop",
    "<impl Drop for Bell>::drop",
    # Test code inside src/ (the `mod tests` helpers).
    " tests::",
    # The non-Windows stand-ins for crates/install/src/setup/, which changes
    # the machine (VM-STEPS D.5 and R).
    "replace (install|uninstall) -> Result<Outcome, String> with Ok",
    # MMCSS "Pro Audio": its effect is only scheduling priority under load (the
    # VM's cpu-load runs), and reverting it releases an OS registration.
    "<impl Drop for ProAudio>::drop",
    # Equivalent: two Instants a gap apart are never exactly equal to the limit.
    "replace > with >= in GapMeter::tick",
    # Equivalent: the IOCTL code's three bit fields don't overlap, so | and ^ agree.
    "replace \\| with \\^ in ioctl",
    # Equivalent: with one channel in (or out) the downmix (or upmix) leaves the
    # samples as they are, so taking that path at 1 changes nothing. (`samples`
    # since the converter's refactor; `convert` before.)
    "replace > with >= in Converter::(convert|samples)",
    # The 10-minute queue cap's `* channels`: with mono, * 1 and / 1 (or + 1)
    # agree, and seeing it with stereo takes 10 minutes of samples (~200 MB) in a
    # test. Pinned to its line and column; if the line moves these come back as
    # missed, so update it then.
    "queue\\.rs:49:76: replace \\* with [+/] in Playout::push",
    # Debug output: cosmetic, no behaviour.
    "<impl (std::)?fmt::Debug for ",
    # Equivalent: NaN becomes 0 either way (Rust's float-to-int cast saturates
    # NaN to 0), and a subnormal rounds to 0 anyway.
    "replace \\|\\| with && in pcm16",
    # Equivalent: the bias keeps bit 7 set, so the segment loop always stops by 0.
    "replace > with >= in mu_law_encode",
    # Equivalent: sign, segment and mantissa bits don't overlap, so | and ^ agree.
    "replace \\| with \\^ in mu_law_encode",
    # Equivalent: keeping more history than taps - 1 changes nothing, since
    # `base` follows the history's length. Pinned to its line and column (as
    # the queue cap above); the next line's mutant there is caught.
    "convert/mod\\.rs:131:31: replace - with [+/] in Resampler::process",
    # Equivalent output: an unreduced ratio only makes the filter table bigger.
    "replace gcd -> u32 with 1",
    # Equivalent: pushing nothing starts an empty reply, which ends at the next check.
    "replace > with >= in Playout::push",
    # Only waits of 49.7 days or more (INFINITE - 1 ms) differ.
    "replace - with / in Bell::wait",
    # The default: the Windows Backend's lead, which only the VM sees; host
    # tests use the In-process core's own (backend/in_process/).
    "replace Backend::lead_frames -> u32",
    # Equivalent on Windows, where mutation runs: its only In-process backends
    # are the tests' (`with_nodes`), which don't follow the pull; Linux's
    # `for_process` does, and the PipeWire tests (ci.yml) see it.
    "replace <impl Backend for InProcessBackend>::lead_follows_pull -> bool with false",
    # Equivalent: every queued sample is in a reply's `queued` until it's taken,
    # and `interrupt` clears both, so where every reply has played the queue is
    # already empty; `wait_idle`'s `is_empty()` is a guard, not the deciding test.
    "replace Queue::is_empty -> bool with true",
    # Linux-only code inside shared files, not compiled on Windows where mutation
    # runs (as backend/linux/ above): the clock's and doorbell's `linux` modules, the
    # fallback clock, and the Linux core's setup.
    " (linux|elsewhere)::",
    " (process_core|InProcessBackend::for_process) ->",
]
